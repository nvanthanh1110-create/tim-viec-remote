# Lấy tin việc remote mới 2 lần/ngày rồi đưa trang remote-jobs/ lên GitHub Pages.
name: Remote jobs feed

on:
  schedule:
    - cron: '17 23 * * *'   # 06:17 giờ Việt Nam
    - cron: '17 11 * * *'   # 18:17 giờ Việt Nam
  workflow_dispatch:         # bấm "Run workflow" để chạy tay
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch jobs
        run: node remote-jobs/fetch-jobs.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote-jobs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
